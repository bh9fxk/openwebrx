name: 发布 OWRX 开发版基础镜像

on:
  workflow_dispatch:
    inputs:
      build_amd64:
        description: '构建 amd64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_arm64:
        description: '构建 arm64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_armv7:
        description: '构建 arm/v7（默认否，慢！）'
        required: true
        default: 'false'
        type: boolean

# 第一步：生成北京时间戳，所有 job 共享
jobs:
  init:
    name: 生成时间戳
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set.outputs.timestamp }}
    steps:
      - id: set
        run: |
          echo "timestamp=dev-$(date -u -d '+8 hours' '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  # ====================== amd64 ======================
  amd64:
    needs: init
    if: ${{ github.event.inputs.build_amd64 == 'true' || github.event_name != 'workflow_dispatch' }}
    name: Build amd64
    runs-on: ubuntu-latest
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: actions/checkout@v5.0.1

      - name: 生成 amd64 专属标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-amd64
            type=raw,value=${{ env.TIMESTAMP_TAG }}-amd64

      - uses: docker/setup-buildx-action@v3.11.1

      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push amd64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64,mode=max

  # ====================== arm64 ======================
  arm64:
    needs: [init]
    if: ${{ github.event.inputs.build_arm64 == 'true' || github.event_name != 'workflow_dispatch' }}
    name: Build arm64
    runs-on: ubuntu-latest
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0

      - name: 生成 arm64 专属标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-arm64
            type=raw,value=${{ env.TIMESTAMP_TAG }}-arm64

      - uses: docker/setup-buildx-action@v3.11.1

      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64,mode=max

  # ====================== arm/v7 ======================
  armv7:
    needs: [init]
    if: ${{ github.event.inputs.build_armv7 == 'true' }}
    name: Build arm/v7（慢）
    runs-on: ubuntu-latest
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0

      - name: 生成 armv7 专属标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-armv7
            type=raw,value=${{ env.TIMESTAMP_TAG }}-armv7

      - uses: docker/setup-buildx-action@v3.11.1

      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push arm/v7
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7,mode=max

  # ====================== 合并 multi-arch ======================
  manifest:
    needs: [init, amd64, arm64, armv7]
    if: always() && (needs.armv7.result == 'success' || needs.armv7.result == 'skipped')
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 合并 multi-arch（支持只勾一个平台）
        run: |
          SOURCES=""
          [[ "${{ needs.amd64.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-amd64"
          [[ "${{ needs.arm64.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-arm64"
          [[ "${{ needs.armv7.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-armv7"

          echo "本次参与合并的镜像: $SOURCES"

          # 关键修复：如果有至少一个平台成功，就执行合并
          if [ -n "$SOURCES" ]; then
            # 合并成时间戳标签
            docker buildx imagetools create \
              -t bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }} \
              $SOURCES

            # 更新 dev-latest
            docker buildx imagetools create \
              -t bh9fxk/openwebrx-base:${{ env.LATEST_TAG }} \
              bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}

            echo "multi-arch 镜像发布成功！"
            echo "时间戳标签 → bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}"
            echo "最新标签   → bh9fxk/openwebrx-base:${{ env.LATEST_TAG }}"
          else
            echo "没有任何平台构建成功，跳过 manifest 合并"
            exit 0
          fi
          
  # ====================== 清理旧 workflow ======================
  cleanup:
    needs: [manifest]
    if: always()
    name: 清理旧 workflow runs
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
