name: 发布 OWRX 开发版基础镜像

on:
  workflow_dispatch:     # 手动触发时可选择只跑哪些平台
    inputs:
      build_amd64:
        description: '构建 amd64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_arm64:
        description: '构建 arm64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_armv7:
        description: '构建 arm/v7（默认否，慢！）'
        required: true
        default: 'false'
        type: boolean

jobs:
  # ====================== 阶段1：amd64（最快，永远先跑） ======================
  amd64:
    if: github.event.inputs.build_amd64 == 'true' || github.event_name != 'workflow_dispatch'
    name: Build amd64
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v5.0.1
      - name: 生成统一标签（所有平台共用）
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          flavor: latest=false
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-{{date 'YYYYMMDD-HHmmss' tz='Asia/Shanghai'}}
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push amd64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          flavor: |
            suffix=-amd64          # 关键！加上后缀
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64,mode=max

  # ====================== 阶段2：arm64（中等速度） ======================
  arm64:
    if: github.event.inputs.build_arm64 == 'true' || github.event_name != 'workflow_dispatch'
    needs: amd64
    name: Build arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm64
          push: true
          tags: ${{ needs.amd64.outputs.tags }}
          labels: ${{ needs.amd64.outputs.labels }}
          flavor: |
            suffix=-arm64          # 关键！加上后缀
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64,mode=max

  # ====================== 阶段3：arm/v7（最慢，彻底隔离） ======================
  armv7:
    if: github.event.inputs.build_armv7 == 'true'
    needs: amd64
    name: Build arm/v7（慢！）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push arm/v7
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm/v7
          push: true
          tags: ${{ needs.amd64.outputs.tags }}
          labels: ${{ needs.amd64.outputs.labels }}
          flavor: |
            suffix=--armv7          # 关键！加上后缀
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7,mode=max

  # ====================== 阶段4：合并成最终 multi-arch 镜像（彻底修复版）======================
  manifest:
    needs: [amd64, arm64, armv7]
    if: always() && (needs.armv7.result == 'success' || needs.armv7.result == 'skipped')
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 创建 multi-arch manifest（100% 稳）
        run: |
          # 原始 tags 是完整镜像名列表，用逗号分隔
          RAW_TAGS="${{ needs.amd64.outputs.tags }}"
          echo "原始 tags: $RAW_TAGS"

          # 把逗号换成换行，方便遍历
          echo "$RAW_TAGS" | tr ',' '\n' > /tmp/tags.txt

          while IFS= read -r FULL_TAG; do
            echo "=== 处理镜像: $FULL_TAG ==="

            # 构造来源镜像列表（只用实际构建成功的平台）
            SOURCES=""

            if [[ "${{ needs.amd64.result }}" == "success" ]]; then
              SOURCES="$SOURCES $FULL_TAG-amd64"
            fi

            if [[ "${{ needs.arm64.result }}" == "success" ]]; then
              SOURCES="$SOURCES $FULL_TAG-arm64"
            fi

            if [[ "${{ needs.armv7.result }}" == "success" ]]; then
              SOURCES="$SOURCES $FULL_TAG-armv7"
            fi

            echo "来源镜像: $SOURCES"

            # 只要有一个平台成功就执行合并
            if [ -n "$SOURCES" ]; then
              docker buildx imagetools create "$FULL_TAG" $SOURCES || echo "此标签合并失败，跳过"
            fi
          done < /tmp/tags.txt

          # 最后强制把 dev-latest 指向最新的时间戳标签（最重要！）
          LATEST_TIMESTAMP_TAG=$(echo "$RAW_TAGS" | tr ',' '\n' | grep -E 'dev-[0-9]{8}-[0-9]{6}$' | head -1)
          if [ -n "$LATEST_TIMESTAMP_TAG" ]; then
            echo "=== 强制更新 dev-latest 指向 ===> $LATEST_TIMESTAMP_TAG"
            docker buildx imagetools create bh9fxk/openwebrx-base:dev-latest "$LATEST_TIMESTAMP_TAG"
          fi
          
  # ====================== 清理旧 runs ======================
  cleanup:
    needs: manifest
    name: 清理旧 workflow runs
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
