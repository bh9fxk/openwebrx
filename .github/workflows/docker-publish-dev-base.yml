name: 发布 OWRX 开发版基础镜像（三平台完全分离）

on:
  workflow_dispatch:     # 手动触发时可选择只跑哪些平台
    inputs:
      build_amd64:
        description: '构建 amd64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_arm64:
        description: '构建 arm64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_armv7:
        description: '构建 arm/v7（默认否，慢！）'
        required: true
        default: 'false'
        type: boolean
# 关键：所有 job 共享同一个时间戳！
env:
  TIMESTAMP_TAG: dev-${{ github.run_id }}           # 每次 workflow 运行唯一
  LATEST_TAG: dev-latest
  
jobs:
  # ====================== 阶段1：amd64（最快，永远先跑） ======================
  amd64:
    if: ${{ github.event.inputs.build_amd64 == 'true' || github.event_name != 'workflow_dispatch' }}
    name: Build amd64
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v5.0.1

      - name: 生成amd64平台专属标签（共享时间戳）
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-amd64
            type=raw,value=${{ env.TIMESTAMP_TAG }}-amd64
          labels: |
            maintainer=BH9FXK
            org.opencontainers.image.title=OpenWebRX Base Image (amd64)

      - uses: docker/setup-buildx-action@v3.11.1

      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push amd64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64,mode=max

  # ====================== 阶段2：arm64（中等速度） ======================
  arm64:
    if: ${{ github.event.inputs.build_arm64 == 'true' || github.event_name != 'workflow_dispatch' }}
    needs: amd64
    name: Build arm64
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0

      - name: 生成 arm64 专属标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            # arm64 专属标签：dev-latest-arm64 和时间戳-arm64
            type=raw,value=${{ env.LATEST_TAG }}-arm64
            type=raw,value=${{ env.TIMESTAMP_TAG }}-arm64
          labels: |
            maintainer=BH9FXK
            org.opencontainers.image.title=OpenWebRX Base Image (arm64)

      - uses: docker/setup-buildx-action@v3.11.1
      
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64,mode=max

  # ====================== 阶段3：arm/v7（最慢，彻底隔离） ======================
  armv7:
    if: ${{ github.event.inputs.build_armv7 == 'true' }}
    needs: amd64
    name: Build arm/v7（慢！）
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0

      - name: 生成 armv7 专属标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            # armv7 专属标签：dev-latest-armv7 和时间戳-armv7
            type=raw,value=${{ env.LATEST_TAG }}-armv7
            type=raw,value=${{ env.TIMESTAMP_TAG }}-armv7
          labels: |
            maintainer=BH9FXK
            org.opencontainers.image.title=OpenWebRX Base Image (armv7)

      - uses: docker/setup-buildx-action@v3.11.1

      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push arm/v7
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7,mode=max

  # ====================== 阶段4：合并成最终 multi-arch 镜像 ======================
  manifest:
    needs: [amd64, arm64, armv7]
    if: always() && (needs.armv7.result == 'success' || needs.armv7.result == 'skipped')
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 合并 multi-arch 镜像（终极稳版）
        run: |
          SOURCES=""

          if [[ "${{ needs.amd64.result }}" == "success" ]]; then
            SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-amd64"
          fi
          if [[ "${{ needs.arm64.result }}" == "success" ]]; then
            SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-arm64"
          fi
          if [[ "${{ needs.armv7.result }}" == "success" ]]; then
            SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-armv7"
          fi

          echo "合并来源: $SOURCES"

          # 创建时间戳 multi-arch
          docker manifest create bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }} $SOURCES
          docker manifest push bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}

          # 更新 dev-latest 指向最新时间戳
          docker manifest create bh9fxk/openwebrx-base:${{ env.LATEST_TAG }} bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}
          docker manifest push bh9fxk/openwebrx-base:${{ env.LATEST_TAG }}
          
  # ====================== 清理旧 runs ======================
  cleanup:
    needs: [amd64, arm64, armv7, manifest]
    if: always()
    name: 清理旧 workflow runs
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
