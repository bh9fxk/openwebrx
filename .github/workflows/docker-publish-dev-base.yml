name: 发布 OWRX 开发版基础镜像

on:
  workflow_dispatch:     # 手动触发时可选择只跑哪些平台
    inputs:
      build_amd64:
        description: '构建 amd64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_arm64:
        description: '构建 arm64（默认是）'
        required: true
        default: 'true'
        type: boolean
      build_armv7:
        description: '构建 arm/v7（默认否，慢！）'
        required: true
        default: 'false'
        type: boolean

jobs:
  # ====================== 阶段1：amd64（最快，永远先跑） ======================
  amd64:
    if: github.event.inputs.build_amd64 == 'true' || github.event_name != 'workflow_dispatch'
    name: Build amd64
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v5.0.1
      - name: 生成统一标签（所有平台共用）
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          flavor: latest=false
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-{{date 'YYYYMMDD-HHmmss' tz='Asia/Shanghai'}}
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push amd64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64,mode=max

  # ====================== 阶段2：arm64（中等速度） ======================
  arm64:
    if: github.event.inputs.build_arm64 == 'true' || github.event_name != 'workflow_dispatch'
    needs: amd64
    name: Build arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm64
          push: true
          tags: ${{ needs.amd64.outputs.tags }}
          labels: ${{ needs.amd64.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64,mode=max

  # ====================== 阶段3：arm/v7（最慢，彻底隔离） ======================
  armv7:
    if: github.event.inputs.build_armv7 == 'true'
    needs: amd64
    name: Build arm/v7（慢！）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push arm/v7
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm/v7
          push: true
          tags: ${{ needs.amd64.outputs.tags }}
          labels: ${{ needs.amd64.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7,mode=max

  # ====================== 阶段4：合并成最终 multi-arch 镜像 ======================
  manifest:
    needs: [amd64, arm64, armv7]
    if: always() && (needs.armv7.result == 'success' || needs.armv7.result == 'skipped')
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 合并所有平台为 multi-arch
        run: |
          # 从 amd64 job 拿到所有标签（dev-latest 和带时间戳的两个）
          TAGS="${{ needs.amd64.outputs.tags }}"
          
          # 遍历每个标签，分别创建 multi-arch manifest
          for TAG in $(echo "$TAGS" | tr ',' '\n'); do
            echo "=== Creating multi-arch manifest for bh9fxk/openwebrx-base:$TAG ==="
            
            # 构建来源镜像列表（已经推上去的单架构镜像）
            SOURCES=""
            [ "${{ needs.amd64.result }}" = "success" ] && SOURCES="$SOURCES bh9fxk/openwebrx-base:$TAG"
            [ "${{ needs.arm64.result }}" = "success" ] && SOURCES="$SOURCES bh9fxk/openwebrx-base:$TAG"
            [ "${{ needs.armv7.result }}" = "success" ] && SOURCES="$SOURCES bh9fxk/openwebrx-base:$TAG"
            
            # 只有至少有一个平台成功才执行合并
            if [ -n "$SOURCES" ]; then
              docker buildx imagetools create -t "bh9fxk/openwebrx-base:$TAG" $SOURCES
            fi
          done
          
          # 特别处理 dev-latest（最重要！一定要指向最新的时间戳标签）
          LATEST_TAG=$(echo "$TAGS" | tr ',' '\n' | grep '^dev-' | head -1)
          if [ -n "$LATEST_TAG" ]; then
            echo "=== 更新 dev-latest 指向最新时间戳标签 ==="
            docker buildx imagetools create bh9fxk/openwebrx-base:dev-latest \
              bh9fxk/openwebrx-base:$LATEST_TAG
          fi

  # ====================== 清理旧 runs ======================
  cleanup:
    needs: manifest
    name: 清理旧 workflow runs
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
