name: 发布 OWRX 开发版基础镜像

on:
  workflow_dispatch:      # 支持手动触发
  # schedule:
  #   - cron: "30 19 * * *"  # 如果需要每天北京时间 19:30 自动构建，可以取消注释

jobs:
  push_to_registry:
    name: 推送 Docker 镜像到 Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5.0.1

      - name: 设置 QEMU（支持多架构构建）
        uses: docker/setup-qemu-action@v3.7.0

      - name: 设置 Docker Buildx（多架构构建工具）
        uses: docker/setup-buildx-action@v3.11.1

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-{{date 'YYYYMMDD-HHmmss' tz='Asia/Shanghai'}}
          labels: |
            maintainer=BH9FXK
            org.opencontainers.image.title=OpenWebRX Base Image
            org.opencontainers.image.description=OpenWebRX 开发版基础镜像（含 rtl-sdr、soapy 等依赖）
            org.opencontainers.image.vendor=BH9FXK
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          # platforms: linux/amd64,linux/arm/v7,linux/arm64
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:dev-latest
          cache-to: type=inline

      - name: 清理旧的 workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
