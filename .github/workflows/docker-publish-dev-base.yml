name: 发布 OWRX 开发版基础(base)镜像

# 去掉手动选择，默认全平台构建（需要时直接点 Run workflow 即可）
on:
  workflow_dispatch:
  # 如需定时自动构建，可再加下面这行（比如每天凌晨）
  # schedule:
  #   - cron: '0 18 * * *'   # 北京时间 02:00

jobs:
  # 第一步：生成北京时间戳，所有平台共享
  init:
    name: 生成时间戳
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set.outputs.timestamp }}
    steps:
      - id: set
        run: |
          echo "timestamp=dev-$(date -u -d '+8 hours' '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  # ====================== amd64 ======================
  amd64:
    needs: init
    name: Build amd64
    runs-on: ubuntu-latest
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: actions/checkout@v6
      - name: 生成 amd64 标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-amd64
            # type=raw,value=${{ env.TIMESTAMP_TAG }}-amd64
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push amd64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-amd64,mode=max

  # ====================== arm64 ======================
  arm64:
    needs: init
    name: Build arm64
    runs-on: ubuntu-24.04-arm
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: actions/checkout@v6
      - name: 生成 arm64 标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-arm64
            # type=raw,value=${{ env.TIMESTAMP_TAG }}-arm64
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-arm64,mode=max

  # ====================== arm/v7（最慢） ======================
  armv7:
    needs: init
    name: Build arm/v7
    runs-on: ubuntu-24.04-arm
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: docker/setup-qemu-action@v3.7.0
        with:
          platforms: arm
      - name: 生成 armv7 标签
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: bh9fxk/openwebrx-base
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}-armv7
            # type=raw,value=${{ env.TIMESTAMP_TAG }}-armv7
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push arm/v7
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfiles/Dockerfile-base
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7
          cache-to: type=registry,ref=bh9fxk/openwebrx-base:cache-armv7,mode=max

  # ====================== 合并 multi-arch ======================
  manifest:
    needs: [init, amd64, arm64, armv7]
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    env:
      TIMESTAMP_TAG: ${{ needs.init.outputs.timestamp }}
      LATEST_TAG: dev-latest
    steps:
      - uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 合并 multi-arch 镜像
        run: |
          SOURCES=""
          #[[ "${{ needs.amd64.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-amd64"
          #[[ "${{ needs.arm64.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-arm64"
          #[[ "${{ needs.armv7.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}-armv7"
          [[ "${{ needs.amd64.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.LATEST_TAG }}-amd64"
          [[ "${{ needs.arm64.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.LATEST_TAG }}-arm64"
          [[ "${{ needs.armv7.result }}" == "success" ]] && SOURCES="$SOURCES bh9fxk/openwebrx-base:${{ env.LATEST_TAG }}-armv7"

          echo "本次参与合并: $SOURCES"

          docker buildx imagetools create -t bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }} $SOURCES
          docker buildx imagetools create -t bh9fxk/openwebrx-base:${{ env.LATEST_TAG }} \
            bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}

          echo "multi-arch 镜像已发布！"
          echo "时间戳标签 → bh9fxk/openwebrx-base:${{ env.TIMESTAMP_TAG }}"
          echo "最新标签   → bh9fxk/openwebrx-base:${{ env.LATEST_TAG }}"

  # ====================== 清理旧 workflow ======================
  cleanup:
    needs: manifest
    name: 清理旧 workflow runs
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
